<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family Wishlists</title><link rel="stylesheet" href="style.css?v=7"><script defer src="config.js?v=20261125-2"></script><script defer src="app.js?v=20261125-7"></script></head><body><main><header><span class="eyebrow">THE FAMILY GIFT DIRECTORY</span><h1>Family Wishlists</h1><p>All your wishlists, together in one place.</p></header><section id="gate"><form id="login"><label for="code">Family access code</label><input id="code" type="password" required autocomplete="current-password"><label class="check"><input id="remember" type="checkbox"> Remember on this device</label><button>Continue</button></form></section><section id="directory" hidden><div class="directory-heading"><h2>Wishlists</h2><div class="directory-tools"><button id="add-toggle" type="button" class="add-toggle" aria-expanded="false" aria-controls="add">+ Add member</button><button id="logout" type="button" class="secondary">Sign out</button></div></div><form id="add" class="add-panel" hidden><label for="name">Add a family member</label><input id="name" maxlength="60" required placeholder="Name"><div class="actions"><button id="add-cancel" type="button" class="secondary">Cancel</button><button type="submit">Add</button></div></form><div id="members"></div><button id="refresh" class="secondary">Refresh lists</button></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
