<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family Wishlists</title><link rel="stylesheet" href="style.css?v=15"><script defer src="config.js?v=20261125-2"></script><script defer src="app.js?v=20261125-10"></script></head><body><main><header><span class="eyebrow">THE FAMILY GIFT DIRECTORY</span><h1>Family Wishlists</h1><p>All your wishlists, together in one place.</p></header><section id="gate"><form id="login"><label for="code">Family access code</label><input id="code" type="password" required autocomplete="current-password"><label class="check"><input id="remember" type="checkbox"> Remember on this device</label><button>Continue</button></form></section><section id="directory" hidden><div class="directory-heading"><h2>Wishlists</h2><div class="directory-tools"><button id="add-toggle" type="button" class="add-toggle" aria-expanded="false" aria-haspopup="dialog" aria-controls="add-dialog"><span aria-hidden="true">+</span> Add member</button><button id="logout" type="button" class="secondary">Sign out</button></div></div><dialog id="add-dialog" aria-labelledby="add-title"><form id="add" class="add-panel"><div class="modal-heading"><h2 id="add-title">Add family member</h2><button id="add-close" type="button" class="close-button" aria-label="Close">×</button></div><p class="form-hint">Add a name to the shared wishlist directory.</p><label for="name">Name</label><input id="name" maxlength="20" aria-describedby="name-hint" required placeholder="e.g. Grandma" autocomplete="off"><p id="name-hint" class="name-hint">Maximum 20 characters.</p><p id="add-status" role="status" aria-live="polite"></p><div class="actions"><button id="add-cancel" type="button" class="secondary">Cancel</button><button type="submit">Add member</button></div></form></dialog><div id="members"></div><div class="directory-footer"><button id="refresh" type="button" class="secondary">Refresh lists</button><p id="directory-status" role="status" aria-live="polite"></p></div></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
